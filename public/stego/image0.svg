<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#cc0033" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#66001a" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  <circle cx="100" cy="100" r="45" fill="url(#redGlow)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="25" fill="#ff6688" opacity="0.6"/>
  <circle cx="100" cy="100" r="10" fill="#ffffff" opacity="0.85"/>
  <text x="100" y="180" font-family="monospace" font-size="10" fill="#ff3366" opacity="0.6" text-anchor="middle" letter-spacing="2">FRAGMENT // 0</text>
</svg>
