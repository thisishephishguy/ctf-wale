<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" center="50%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#16a34a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="48" y="48" width="104" height="104" rx="10" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  <rect x="58" y="58" width="84" height="84" rx="8" fill="url(#greenGlow)" filter="url(#glow2)"/>
  <rect x="75" y="75" width="50" height="50" rx="4" fill="#86efac" opacity="0.6"/>
  <circle cx="100" cy="100" r="8" fill="#ffffff" opacity="0.85"/>
  <text x="100" y="180" font-family="monospace" font-size="10" fill="#22c55e" opacity="0.6" text-anchor="middle" letter-spacing="2">FRAGMENT // 2</text>
</svg>
